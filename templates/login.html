<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <style>
        :root {
            --bg: #F6F0E6;
            --surface: #FFFDF8;
            --ink: #2B2620;
            --ink-soft: #5F5649;
            --muted: #8E8375;
            --line: #E9DFCE;
            --accent: #B9812F;
            --accent-deep: #8F5E1D;
            --accent-soft: #F4E8D3;
            --rust: #A94E2E;
            --rust-soft: #F7E8E0;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif SC", "STSong", serif;
            --shadow-md: 0 20px 48px rgba(64, 47, 26, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: var(--font-sans);
            color: var(--ink);
            background:
                radial-gradient(900px 420px at 12% -8%, rgba(185, 129, 47, 0.16), transparent 62%),
                radial-gradient(760px 420px at 100% 108%, rgba(169, 78, 46, 0.12), transparent 60%),
                linear-gradient(160deg, #FAF5EC 0%, #F3ECDF 100%);
        }

        /* 细微点纹背景，营造纸张质感 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: radial-gradient(rgba(120, 94, 58, 0.10) 1px, transparent 1.5px);
            background-size: 26px 26px;
            opacity: 0.35;
        }

        .login-card {
            position: relative;
            width: 100%;
            max-width: 408px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 48px 40px 40px;
            box-shadow: var(--shadow-md);
            animation: rise 0.5s ease both;
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: -1px;
            left: 48px;
            right: 48px;
            height: 3px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, var(--accent) 30%, var(--rust) 70%, transparent);
            opacity: 0.85;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card h1 {
            font-family: var(--font-serif);
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--ink);
            text-align: center;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--muted);
            font-size: 14px;
            text-align: center;
            margin-bottom: 34px;
        }

        .messages {
            margin-bottom: 20px;
        }

        .error-msg {
            background: var(--rust-soft);
            border: 1px solid #E7C8B8;
            color: var(--rust);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            padding: 13px 16px;
            background: #FBF7EF;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            font-size: 15px;
            font-family: var(--font-sans);
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input::placeholder {
            color: #B5AA99;
        }

        .form-group input:focus {
            border-color: var(--accent);
            background: #FFFDF8;
            box-shadow: 0 0 0 4px var(--accent-soft);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background: linear-gradient(135deg, #C38B36 0%, #A06B22 100%);
            color: #FFFDF8;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            font-family: var(--font-sans);
            letter-spacing: 0.3em;
            text-indent: 0.3em;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(160, 107, 34, 0.28);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(160, 107, 34, 0.34);
            filter: brightness(1.04);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(160, 107, 34, 0.25);
        }

        button:focus-visible {
            outline: 3px solid var(--accent-soft);
            outline-offset: 2px;
        }

        ::selection {
            background: var(--accent-soft);
            color: var(--accent-deep);
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
                align-items: flex-start;
                padding-top: 9vh;
            }

            .login-card {
                padding: 36px 26px 30px;
                border-radius: 18px;
            }

            .login-card::before {
                left: 26px;
                right: 26px;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>个人博客</h1>
        <p>登录后管理你的内容</p>

        {% if messages %}
        <div class="messages">
            {% for msg in messages %}
            <div class="error-msg">{{ msg }}</div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit">登 录</button>
        </form>
    </div>
</body>
</html>
