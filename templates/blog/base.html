<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}个人博客{% endblock %}</title>
    <style>
        :root {
            --bg: #F7F2E9;
            --surface: #FFFDF8;
            --ink: #2B2620;
            --ink-soft: #5F5649;
            --muted: #8E8375;
            --line: #E9DFCE;
            --accent: #B9812F;
            --accent-deep: #8F5E1D;
            --accent-soft: #F4E8D3;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif SC", "STSong", serif;
            --shadow-sm: 0 1px 3px rgba(64, 47, 26, 0.06);
            --shadow-lg: 0 18px 44px rgba(64, 47, 26, 0.13);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            background:
                radial-gradient(1100px 460px at 18% -12%, rgba(185, 129, 47, 0.08), transparent 62%),
                var(--bg);
            color: var(--ink);
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

        ::selection {
            background: var(--accent-soft);
            color: var(--accent-deep);
        }

        /* 顶栏 */
        .header {
            background: rgba(247, 242, 233, 0.82);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            padding: 0 40px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-inner {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 62px;
        }

        .header .logo {
            font-family: var(--font-serif);
            font-size: 21px;
            font-weight: 700;
            color: var(--ink);
            text-decoration: none;
            letter-spacing: 0.02em;
        }

        .header .logo span {
            color: var(--accent);
        }

        .header nav a {
            position: relative;
            color: var(--ink-soft);
            text-decoration: none;
            font-size: 14.5px;
            margin-left: 26px;
            padding: 6px 2px;
            transition: color 0.18s ease;
        }

        .header nav a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 100%;
            bottom: 0;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
            transition: right 0.2s ease;
        }

        .header nav a:hover {
            color: var(--accent-deep);
        }

        .header nav a:hover::after {
            right: 0;
        }

        /* 主内容 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 46px 20px 30px;
            display: flex;
            gap: 44px;
            align-items: flex-start;
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
        }

        /* 侧边栏 */
        .sidebar-widget {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-widget h3 {
            font-family: var(--font-serif);
            font-size: 16.5px;
            color: var(--ink);
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
            position: relative;
            letter-spacing: 0.02em;
        }

        .sidebar-widget h3::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -1px;
            width: 38px;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

        .sidebar-widget a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--ink-soft);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 10px;
            margin: 1px -10px;
            border-radius: 9px;
            transition: background 0.18s ease, color 0.18s ease, padding-left 0.18s ease;
        }

        .sidebar-widget a:hover {
            background: var(--accent-soft);
            color: var(--accent-deep);
            padding-left: 15px;
        }

        .sidebar-widget .count {
            font-size: 12px;
            color: var(--muted);
            background: #F2EADB;
            padding: 1px 9px;
            border-radius: 999px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        .sidebar-widget a:hover .count {
            background: var(--accent);
            color: #FFFDF8;
        }

        /* 文章卡片 */
        .post-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 22px;
            box-shadow: var(--shadow-sm);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: #E4D5BC;
        }

        .post-card .post-meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
            letter-spacing: 0.02em;
        }

        .post-card .post-meta a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .post-card .post-meta a:hover {
            color: var(--accent-deep);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .post-card h2 {
            font-family: var(--font-serif);
            font-size: 24px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .post-card h2 a {
            color: var(--ink);
            text-decoration: none;
            transition: color 0.18s ease;
        }

        .post-card h2 a:hover {
            color: var(--accent-deep);
        }

        .post-card .excerpt {
            font-size: 14.5px;
            color: var(--ink-soft);
            line-height: 1.85;
            margin-bottom: 16px;
        }

        .post-card .tags,
        .post-detail .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .post-card .tag,
        .post-detail .tag {
            background: var(--accent-soft);
            color: var(--accent-deep);
            padding: 3px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            text-decoration: none;
            transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        }

        .post-card .tag:hover,
        .post-detail .tag:hover {
            background: var(--accent);
            color: #FFFDF8;
            transform: translateY(-1px);
        }

        /* 文章详情 */
        .post-detail {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 46px 48px;
            box-shadow: var(--shadow-sm);
            max-width: 760px;
            margin: 0 auto;
        }

        .post-detail h1 {
            font-family: var(--font-serif);
            font-size: 32px;
            line-height: 1.4;
            color: var(--ink);
            margin-bottom: 14px;
            letter-spacing: 0.01em;
        }

        .post-detail .post-meta {
            font-size: 13.5px;
            color: var(--muted);
            padding-bottom: 22px;
            border-bottom: 1px solid var(--line);
            margin-bottom: 26px;
            letter-spacing: 0.02em;
        }

        .post-detail .post-meta a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .post-detail .post-meta a:hover {
            color: var(--accent-deep);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .post-detail .post-body {
            font-size: 17px;
            line-height: 2.05;
            color: #3A332B;
        }

        .post-detail .post-body p {
            margin-bottom: 20px;
        }

        /* 空状态 */
        .empty {
            text-align: center;
            padding: 90px 20px;
            color: var(--muted);
        }

        .empty h2 {
            font-family: var(--font-serif);
            font-size: 22px;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        /* 底栏 */
        .footer {
            text-align: center;
            padding: 44px 20px;
            color: var(--muted);
            font-size: 13px;
            border-top: 1px solid var(--line);
            margin-top: 20px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                padding: 26px 14px;
                gap: 30px;
            }

            .sidebar {
                width: 100%;
            }

            .header {
                padding: 0 16px;
            }

            .header-inner {
                height: 56px;
            }

            .post-card {
                padding: 24px 20px;
            }

            .post-detail {
                padding: 30px 22px;
            }

            .post-detail h1 {
                font-size: 26px;
            }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="{% url 'blog:post_list' %}" class="logo"><span>✦</span> 个人博客</a>
            <nav>
                <a href="{% url 'blog:post_list' %}">首页</a>
                <a href="{% url 'home' %}">管理</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <main class="content">
            {% block content %}{% endblock %}
        </main>
        <aside class="sidebar">
            {% block sidebar %}
            <div class="sidebar-widget">
                <h3>文章分类</h3>
                {% for cat in categories %}
                {% if cat.slug %}
                <a href="{% url 'blog:category_posts' cat.slug %}">
                    {{ cat.name }} <span class="count">{{ cat.post_count }}</span>
                </a>
                {% endif %}
                {% empty %}
                <span style="color:var(--muted); font-size:13px;">暂无分类</span>
                {% endfor %}
            </div>
            {% endblock %}
        </aside>
    </div>

    <footer class="footer">
        &copy; {% now "Y" %} 个人博客 · Powered by Django
    </footer>
</body>
</html>
