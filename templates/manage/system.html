{% extends 'manage/base.html' %}
{% block title %}系统管理{% endblock %}

{% block manage_content %}
<div class="page-header">
    <h1>系统管理</h1>
</div>

<div class="form-card" style="margin-bottom: 24px;">
    <h2 style="font-family:var(--font-serif); font-size:18px; color:var(--ink); margin-bottom:6px;">账户信息</h2>
    <p style="font-size:13px; color:var(--muted); margin-bottom:20px;">当前登录账户的基本信息</p>

    <form method="post" style="margin-bottom:20px;">
        {% csrf_token %}
        <input type="hidden" name="action" value="email">
        <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" style="max-width:320px;">
        </div>
        <button type="submit" class="btn btn-primary">更新邮箱</button>
    </form>

    <table style="width:100%; border-collapse:collapse;">
        <tr style="border-bottom:1px solid var(--line);">
            <td style="padding:12px 0; font-size:13px; color:var(--muted); width:100px;">用户名</td>
            <td style="padding:12px 0; font-size:14px; color:var(--ink);">{{ user.username }}</td>
        </tr>
        <tr>
            <td style="padding:12px 0; font-size:13px; color:var(--muted);">加入时间</td>
            <td style="padding:12px 0; font-size:14px; color:var(--ink);">{{ user.date_joined|date:"Y-m-d H:i" }}</td>
        </tr>
    </table>
</div>

<div class="form-card">
    <h2 style="font-family:var(--font-serif); font-size:18px; color:var(--ink); margin-bottom:6px;">修改密码</h2>
    <p style="font-size:13px; color:var(--muted); margin-bottom:24px;">修改管理员登录密码</p>

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="action" value="password">
        <div class="form-group">
            <label for="old_password">当前密码</label>
            <input type="password" id="old_password" name="old_password" required>
        </div>
        <div class="form-group">
            <label for="new_password">新密码</label>
            <input type="password" id="new_password" name="new_password" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">确认新密码</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn btn-primary">修改密码</button>
    </form>
</div>
{% endblock %}
