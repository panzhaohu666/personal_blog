<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}管理后台{% endblock %} · 个人博客</title>
    <style>
        :root {
            --bg: #F6F0E6;
            --surface: #FFFDF8;
            --ink: #2B2620;
            --ink-soft: #5F5649;
            --muted: #8E8375;
            --line: #E9DFCE;
            --accent: #B9812F;
            --accent-deep: #8F5E1D;
            --accent-soft: #F4E8D3;
            --rust: #A94E2E;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
            --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", "Noto Serif SC", "STSong", serif;
            --shadow-sm: 0 1px 2px rgba(64, 47, 26, 0.05);
            --shadow-lg: 0 20px 48px rgba(64, 47, 26, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            min-height: 100vh;
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
        }

        /* 左侧边栏 */
        .sidebar {
            width: 248px;
            background: linear-gradient(180deg, #302A23, #26211B);
            color: #C6BBA9;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            box-shadow: 4px 0 24px rgba(38, 33, 27, 0.10);
        }

        .sidebar-header {
            padding: 30px 26px 22px;
            border-bottom: 1px solid rgba(255, 244, 224, 0.08);
        }

        .sidebar-header h2 {
            font-family: var(--font-serif);
            font-size: 21px;
            color: #FBF6EC;
            letter-spacing: 0.03em;
        }

        .sidebar-header span {
            display: block;
            font-size: 12px;
            color: #8F8677;
            margin-top: 5px;
            letter-spacing: 0.08em;
        }

        .sidebar-nav {
            flex: 1;
            padding: 18px 0;
            overflow-y: auto;
        }

        .sidebar-nav .nav-label {
            padding: 14px 26px 7px;
            font-size: 11px;
            color: #8F8677;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            font-weight: 600;
        }

        .sidebar-nav a {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 26px;
            color: #BDB19E;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.18s ease, color 0.18s ease, padding-left 0.18s ease;
        }

        .sidebar-nav a:hover {
            background: rgba(255, 244, 224, 0.06);
            color: #F5EDDF;
        }

        .sidebar-nav a.active {
            background: rgba(185, 129, 47, 0.16);
            color: #E5B566;
        }

        .sidebar-nav a.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: 0 3px 3px 0;
            background: linear-gradient(180deg, var(--accent), var(--rust));
        }

        .sidebar-nav a .icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            filter: saturate(0.85);
            opacity: 0.9;
            transition: filter 0.18s ease, opacity 0.18s ease;
        }

        .sidebar-nav a:hover .icon {
            filter: none;
            opacity: 1;
        }

        .sidebar-footer {
            padding: 16px 26px;
            border-top: 1px solid rgba(255, 244, 224, 0.08);
        }

        .sidebar-footer a {
            color: #BDB19E;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.18s ease, transform 0.18s ease;
        }

        .sidebar-footer a:hover {
            color: #E5B566;
            transform: translateX(2px);
        }

        /* 右侧主内容区 */
        .main {
            flex: 1;
            margin-left: 248px;
            padding: 40px 44px;
        }

        /* 顶部消息 */
        .messages {
            margin-bottom: 22px;
        }

        .message {
            padding: 13px 18px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 13.5px;
        }

        .message.success {
            background: #E9EFE2;
            color: #5C7A3E;
            border: 1px solid #D0E0BE;
        }

        .message.error {
            background: #FCE4E2;
            color: #A94E2E;
            border: 1px solid #F5C4B6;
        }

        /* 页面头部 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-family: var(--font-serif);
            font-size: 24px;
            color: var(--ink);
            letter-spacing: 0.02em;
        }

        /* 通用按钮 */
        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13.5px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.18s ease;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #C38B36, #9A6320);
            color: #FFFDF8;
            box-shadow: 0 2px 8px rgba(154, 99, 32, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #D4A045, #A96E24);
            box-shadow: 0 4px 16px rgba(154, 99, 32, 0.35);
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--rust);
            color: #FFFDF8;
            box-shadow: 0 2px 8px rgba(169, 78, 46, 0.2);
        }

        .btn-danger:hover {
            background: #C25D37;
            box-shadow: 0 4px 16px rgba(169, 78, 46, 0.3);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: var(--surface);
            color: var(--ink-soft);
            border: 1px solid var(--line);
        }

        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent-deep);
            background: var(--accent-soft);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12.5px;
            border-radius: 8px;
        }

        /* 表格 */
        .table-wrapper {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            background: #FAF6ED;
            padding: 14px 18px;
            text-align: left;
            font-size: 12px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 2px solid var(--line);
        }

        tbody td {
            padding: 14px 18px;
            font-size: 13.5px;
            color: var(--ink-soft);
            border-bottom: 1px solid var(--line);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:hover {
            background: #FFF9F0;
        }

        tbody tr:nth-child(even) {
            background: #FDF9F3;
        }

        tbody tr:nth-child(even):hover {
            background: #FFF9F0;
        }

        .cell-title {
            color: var(--ink);
            font-weight: 500;
        }

        /* 状态徽章 */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: 0.03em;
        }

        .badge-published {
            background: #E9EFE2;
            color: #5C7A3E;
        }

        .badge-draft {
            background: #F6E9D0;
            color: #8F5E1D;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--muted);
        }

        .empty-state p {
            font-size: 14px;
            margin-bottom: 16px;
        }

        /* 表单 */
        .form-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 32px;
            box-shadow: var(--shadow-sm);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            font-family: var(--font-sans);
            color: var(--ink);
            background: #FDFBF7;
            border: 1px solid var(--line);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group .help-text {
            font-size: 11.5px;
            color: var(--muted);
            margin-top: 4px;
        }

        .form-group .error-text {
            font-size: 12px;
            color: var(--rust);
            margin-top: 4px;
        }

        .form-errors {
            background: #FCE4E2;
            border: 1px solid #F5C4B6;
            border-radius: 12px;
            padding: 14px 18px;
            margin-bottom: 22px;
            color: var(--rust);
            font-size: 13px;
        }

        /* radio group */
        .radio-group {
            display: flex;
            gap: 20px;
            padding-top: 4px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13.5px;
            color: var(--ink-soft);
            font-weight: 400;
            cursor: pointer;
        }

        .radio-group input[type="radio"] {
            width: auto;
            accent-color: var(--accent);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        /* 内联添加 */
        .inline-form {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 22px;
            margin-bottom: 26px;
            box-shadow: var(--shadow-sm);
        }

        .inline-form .form-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .inline-form .form-row .form-group {
            margin-bottom: 0;
            flex: 1;
        }

        /* 操作列 */
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .actions form {
            display: inline;
        }

        ::selection {
            background: var(--accent-soft);
            color: var(--accent-deep);
        }

        a:focus-visible,
        button:focus-visible,
        .sidebar-nav a:focus-visible,
        .sidebar-footer a:focus-visible {
            outline: 3px solid var(--accent-soft);
            outline-offset: 2px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                box-shadow: none;
            }

            .sidebar-header {
                display: flex;
                align-items: baseline;
                gap: 10px;
                padding: 18px 20px 14px;
            }

            .sidebar-header span {
                margin-top: 0;
            }

            .sidebar-nav {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                padding: 8px;
            }

            .sidebar-nav .nav-label {
                width: 100%;
                padding: 8px 12px 2px;
            }

            .sidebar-nav a {
                padding: 9px 14px;
                border-radius: 10px;
            }

            .sidebar-nav a.active::before {
                display: none;
            }

            .sidebar-nav a.active {
                background: rgba(185, 129, 47, 0.22);
            }

            .sidebar-footer {
                padding: 12px 20px;
            }

            .main {
                margin-left: 0;
                padding: 28px 18px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .inline-form .form-row {
                flex-direction: column;
                gap: 10px;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>个人博客</h2>
            <span>管理后台</span>
        </div>
        <nav class="sidebar-nav">
            <a href="{% url 'home' %}" {% if request.resolver_match.url_name == 'home' %}class="active"{% endif %}>
                <span class="icon">🏠</span> 工作台
            </a>
            <a href="{% url 'blog:manage:create_post' %}" {% if request.resolver_match.url_name == 'create_post' %}class="active"{% endif %}>
                <span class="icon">✏️</span> 写文章
            </a>
            <a href="{% url 'blog:manage:manage_posts' %}" {% if request.resolver_match.url_name in manage_posts_active %}class="active"{% endif %}>
                <span class="icon">📄</span> 文章管理
            </a>
            <a href="{% url 'blog:manage:manage_categories' %}" {% if request.resolver_match.url_name in manage_categories_active %}class="active"{% endif %}>
                <span class="icon">📁</span> 分类管理
            </a>
            <a href="{% url 'blog:manage:manage_tags' %}" {% if request.resolver_match.url_name in manage_tags_active %}class="active"{% endif %}>
                <span class="icon">🏷️</span> 标签管理
            </a>
            <a href="{% url 'blog:manage:system' %}" {% if request.resolver_match.url_name == 'system' %}class="active"{% endif %}>
                <span class="icon">⚙️</span> 系统管理
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="{% url 'blog:post_list' %}" target="_blank" style="color:#E5B566; margin-bottom:8px;">🌐 查看网站</a>
            <a href="{% url 'logout' %}">🚪 退出登录</a>
        </div>
    </aside>

    <!-- 主内容 -->
    <main class="main">
        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}

        {% block manage_content %}{% endblock %}
    </main>
</body>
</html>
