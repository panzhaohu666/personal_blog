# 生产环境 Docker Compose 配置
# 使用: docker compose -f docker/docker-compose.prod.yml up -d
# 前置: 设置环境变量 (.env 文件)

services:
  postgres:
    image: postgres:16-alpine
    container_name: blog-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blog} -d ${POSTGRES_DB:-blog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog_net

  redis:
    image: redis:7-alpine
    container_name: blog-prod-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - blog_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runner
    container_name: blog-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-blog}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blog}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://your-domain.com}
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    networks:
      - blog_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: prod
    container_name: blog-prod-frontend
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - blog_net

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  blog_net:
    driver: bridge
