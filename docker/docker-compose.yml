# 开发环境 Docker Compose 配置
# 启动: docker compose -f docker/docker-compose.yml up -d
# 停止: docker compose -f docker/docker-compose.yml down

services:
  # ============================================================
  # PostgreSQL 16 数据库
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog_dev_password
      POSTGRES_DB: blog
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog -d blog"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # Redis 7 — 访问统计计数器
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================
  # FastAPI 后端
  # ============================================================
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: dev
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../media:/app/media
    environment:
      DATABASE_URL: postgresql+asyncpg://blog:blog_dev_password@postgres:5432/blog
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://localhost:5173
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # React 前端 (Vite 开发服务器)
  # ============================================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: dev
    container_name: blog-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
