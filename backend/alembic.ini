# Alembic 数据库迁移配置文件
# 运行方式：
#   alembic upgrade head          # 应用所有迁移
#   alembic downgrade -1          # 回滚最近一次迁移
#   alembic revision --autogenerate -m "描述"   # 自动生成迁移

[alembic]
# 迁移脚本存放目录
script_location = migrations

# SQLAlchemy 数据库 URL（异步版本，env.py 中会处理）
# 优先使用环境变量 DATABASE_URL，此处为占位
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/personal_web

# 日志级别
# alembic.runtime.migration 设为 NOTSET 以关闭日志
# loggers = keys: root,sqlalchemy,alembic

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
