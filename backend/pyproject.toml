[project]
name = "personal-web-backend"
version = "0.1.0"
description = "个人博客后端 API 服务 - FastAPI 异步后端"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "panzhaohu", email = "panzhaohu666@gmail.com" },
]
keywords = ["blog", "fastapi", "personal-website", "backend"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    # Database
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    # Redis
    "redis[hiredis]>=5.2,<6.0",
    # Authentication
    "python-jose[cryptography]>=3.3,<4.0",
    "passlib[bcrypt]>=1.7,<2.0",
    # File handling
    "python-multipart>=0.0.18,<1.0",
    "aiofiles>=24.1,<25.0",
    # HTTP client
    "httpx>=0.28,<1.0",
    # RSS
    "feedgen>=1.0,<2.0",
    # Search
    "elasticsearch[async]>=8.17,<9.0",
    # Environment
    "python-dotenv>=1.0,<2.0",
    # Data validation (FastAPI already depends on pydantic, but pin for clarity)
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    # Email (for future password reset)
    "aiosmtplib>=3.0,<4.0",
    "psycopg2-binary>=2.9.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<7.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.14,<2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]
markers = ["slow: marks tests as slow (skipped by default)"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
