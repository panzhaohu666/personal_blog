name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ============================================================
  # 后端检查：格式化 + 类型检查 + 测试
  # ============================================================
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras

      - name: Lint (ruff)
        working-directory: backend
        run: uv run ruff check app/ tests/

      - name: Format check (ruff format)
        working-directory: backend
        run: uv run ruff format --check app/ tests/

      - name: Check migration script
        working-directory: backend
        run: |
          uv run ruff check ../scripts/migrate_data.py
          uv run ruff format --check ../scripts/migrate_data.py

      - name: Type check (basedpyright)
        working-directory: backend
        run: uv run basedpyright --level error app/ tests/

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://blog:test_password@localhost:5432/blog_test
        run: uv run alembic upgrade head

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://blog:test_password@localhost:5432/blog_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-with-at-least-32-bytes
          DEBUG: "false"
        run: uv run pytest -v --cov=app --cov-report=term-missing

  # ============================================================
  # 前端检查：格式 + 类型检查 + lint
  # ============================================================
  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Type check (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Format check (Prettier)
        working-directory: frontend
        run: npx prettier --check "src/**/*.{ts,tsx}" --ignore-path .gitignore

  # ============================================================
  # E2E 测试 (Playwright)
  # ============================================================
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: blog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend deps
        working-directory: backend
        run: uv sync --all-extras

      - name: Migrate and seed E2E data
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://blog:test_password@localhost:5432/blog_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-e2e-secret-key-with-at-least-32-bytes
          DEBUG: "false"
        run: |
          uv run alembic upgrade head
          uv run python - <<'PY'
          import asyncio

          from sqlalchemy import select

          from app.core.database import async_session_factory
          from app.core.security import hash_password
          from app.models.user import User


          async def seed_user() -> None:
              async with async_session_factory() as session:
                  existing = await session.scalar(
                      select(User).where(User.username == "testuser")
                  )
                  if existing is None:
                      session.add(
                          User(
                              username="testuser",
                              email="testuser@example.com",
                              hashed_password=hash_password("testpass123"),
                              is_active=True,
                          )
                      )
                      await session.commit()


          asyncio.run(seed_user())
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          DATABASE_URL: postgresql+asyncpg://blog:test_password@localhost:5432/blog_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-e2e-secret-key-with-at-least-32-bytes
          DEBUG: "false"
          VITE_API_BASE_URL: http://localhost:8000
        run: |
          (cd ../backend && exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000) &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8000/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health

          npx playwright test
